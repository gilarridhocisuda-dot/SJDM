<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login Admin — S JDM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box admin-box">
    <a href="index.html" class="logo"><em class="gs">S</em><b><span>JDM</span></b><small>ADMIN PANEL</small></a>
    <h2>LOGIN ADMIN</h2>
    <p class="hint">Halaman ini khusus pengelola website.</p>
    <form id="f">
      <div class="field"><label>Username</label><input type="text" name="username" required autofocus autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <div class="msg err" id="msg"></div>
      <button class="btn">Masuk Admin</button>
    </form>
    <p class="alt"><a href="index.html">&larr; Kembali ke website</a></p>
  </div>
<script src="js/common.js"></script>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  try {
    await api('/api/login', { method: 'POST', body: { ...d, as: 'admin' } });
    location.href = 'admin.php';
  } catch (err) { document.getElementById('msg').textContent = err.message; }
};
</script>
</body>
</html>
