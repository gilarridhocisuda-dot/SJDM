<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — S JDM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <a href="index.html" class="logo"><em class="gs">S</em><b><span>JDM</span></b><small>SHOWROOM</small></a>
    <h2>BUAT AKUN</h2>
    <form id="f">
      <div class="field"><label>Nama Lengkap</label><input name="name" required autofocus></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Password (min. 6 karakter)</label><input type="password" name="password" minlength="6" required></div>
      <div class="msg err" id="msg"></div>
      <button class="btn">Daftar</button>
    </form>
    <p class="alt">Sudah punya akun? <a href="login.html">Login</a> · <a href="index.html">Kembali</a></p>
  </div>
<script src="js/common.js"></script>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  try { await api('/api/register', { method: 'POST', body: d }); location.href = 'index.html'; }
  catch (err) { document.getElementById('msg').textContent = err.message; }
};
</script>
</body>
</html>
